<title>Duolingo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap">

<style>
/* ── Duolingo Color Tokens (dark theme — extracted from cloudfront CDN) ── */
:root {
  --color-snow: 19, 31, 36;
  --color-polar: 32, 47, 54;
  --color-ice: 23, 52, 58;
  --color-seafoam: 30, 89, 97;
  --color-swan: 55, 70, 79;
  --color-eel: 241, 247, 251;
  --color-wolf: 220, 230, 236;
  --color-hare: 82, 101, 109;
  --color-koala: 72, 90, 98;
  --color-owl: 147, 211, 51;
  --color-tree-frog: 121, 185, 51;
  --color-turtle: 95, 132, 40;
  --color-bee: 255, 199, 0;
  --color-camel: 231, 166, 1;
  --color-macaw: 73, 192, 248;
  --color-whale: 24, 153, 214;
  --color-cardinal: 238, 85, 85;
  --color-fire-ant: 216, 72, 72;
  --color-beetle: 206, 130, 255;
  --color-betta: 144, 105, 205;
  --color-fox: 255, 171, 51;
  --color-guinea-pig: 215, 148, 51;
  --color-canary: 32, 47, 54;

  /* Typography scale (extracted from Duolingo :root) */
  --text-pageTitle-size-large: 2.5rem;
  --text-pageTitle-weight-large: 700;
  --text-pageTitle-line-height-large: 2.75rem;
  --text-heading-size-large: 1.75rem;
  --text-heading-weight-large: 700;
  --text-heading-line-height-large: 2rem;
  --text-heading-size-medium: 1.5rem;
  --text-heading-weight-medium: 700;
  --text-heading-line-height-medium: 2rem;
  --text-heading-size-small: 1.25rem;
  --text-heading-weight-small: 700;
  --text-heading-line-height-small: 1.5rem;
  --text-heading-size-xsmall: 1rem;
  --text-heading-weight-xsmall: 700;
  --text-body-size: 1.25rem;
  --text-body-weight: 500;
  --text-body-weight-bold: 700;
  --text-body-line-height: 1.75rem;
  --text-caption-size: 1rem;
  --text-caption-weight: 500;
  --text-caption-weight-bold: 700;
  --text-caption-line-height: 1.5rem;
  --text-label-size-large: 1.5rem;
  --text-label-weight-large: 700;
  --text-label-casing-large: uppercase;
  --text-label-letter-spacing-large: 0.04em;
  --text-label-size-medium: 1rem;
  --text-label-weight-medium: 700;
  --text-label-casing-medium: uppercase;
  --text-label-letter-spacing-medium: 0.04em;

  /* Semantic aliases — all via rgb(var(--color-*)) */
  --bg:             rgb(var(--color-snow));
  --surface:        rgb(var(--color-polar));
  --surface-2:      rgb(var(--color-ice));
  --surface-3:      rgb(var(--color-seafoam));
  --border:         rgb(var(--color-swan));
  --text-color:     rgb(var(--color-eel));
  --text-secondary: rgb(var(--color-hare));
  --green:          rgb(var(--color-owl));
  --green-dark:     rgb(var(--color-tree-frog));
  --green-shadow:   rgb(var(--color-turtle));
  --gold:           rgb(var(--color-bee));
  --gold-dark:      rgb(var(--color-camel));
  --blue:           rgb(var(--color-macaw));
  --blue-dark:      rgb(var(--color-whale));
  --red:            rgb(var(--color-cardinal));
  --red-dark:       rgb(var(--color-fire-ant));
  --purple:         rgb(var(--color-beetle));
  --orange:         rgb(var(--color-fox));

  color-scheme: dark;
}

@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --color-snow:     247, 247, 247;
    --color-polar:    255, 255, 255;
    --color-ice:      240, 240, 240;
    --color-seafoam:  229, 229, 229;
    --color-swan:     229, 229, 229;
    --color-eel:      75, 75, 75;
    --color-hare:     175, 175, 175;
    --color-koala:    215, 215, 215;
    --color-wolf:     119, 119, 119;
    --color-owl:      88, 204, 2;
    --color-tree-frog:88, 167, 0;
    --color-turtle:   165, 237, 110;
    --color-macaw:    28, 176, 246;
    --color-whale:    7, 147, 212;
    --color-cardinal: 255, 75, 75;
    --color-fire-ant: 234, 43, 43;
    --color-canary:   60, 60, 60;
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --color-snow:     247, 247, 247;
  --color-polar:    255, 255, 255;
  --color-ice:      240, 240, 240;
  --color-seafoam:  229, 229, 229;
  --color-swan:     229, 229, 229;
  --color-eel:      75, 75, 75;
  --color-hare:     175, 175, 175;
  --color-koala:    215, 215, 215;
  --color-wolf:     119, 119, 119;
  --color-owl:      88, 204, 2;
  --color-tree-frog:88, 167, 0;
  --color-turtle:   165, 237, 110;
  --color-macaw:    28, 176, 246;
  --color-whale:    7, 147, 212;
  --color-cardinal: 255, 75, 75;
  --color-fire-ant: 234, 43, 43;
  --color-canary:   60, 60, 60;
  color-scheme: light;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: "duolingo-sans", 'Nunito', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text-color);
  overflow-x: hidden;
}

.app {
  display: grid;
  grid-template-columns: 220px 1fr 280px;
  min-height: 100vh;
  max-width: 1100px;
  margin: 0 auto;
}

/* ── Sidebar ── */
.sidebar {
  position: sticky;
  top: 0;
  height: 100vh;
  padding: 24px 16px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  border-right: 2px solid var(--border);
}
.logo {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 14px;
  margin-bottom: 20px;
  text-decoration: none;
}
.logo-owl { width: 42px; height: 42px; }
.logo-text {
  font-size: var(--text-heading-size-medium);
  font-weight: var(--text-heading-weight-medium);
  color: var(--green);
  letter-spacing: -0.5px;
  text-transform: lowercase;
}
.nav-item {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 12px 14px;
  border-radius: 14px;
  cursor: pointer;
  font-size: var(--text-label-size-medium);
  font-weight: var(--text-label-weight-medium);
  letter-spacing: var(--text-label-letter-spacing-medium);
  text-transform: var(--text-label-casing-medium);
  color: var(--text-secondary);
  border: 2px solid transparent;
  background: none;
  width: 100%;
  text-align: left;
  transition: background 0.12s, color 0.12s;
  font-family: "duolingo-sans", 'Nunito', sans-serif;
}
.nav-item:hover { background: var(--surface-2); color: var(--text-color); }
.nav-item.active {
  color: var(--blue);
  background: rgba(var(--color-macaw), 0.1);
  border-color: rgba(var(--color-macaw), 0.2);
}
.nav-icon { font-size: 1.4rem; width: 28px; text-align: center; }

/* ── Main ── */
.main { padding: 0 24px 80px; position: relative; }
.unit-header {
  background: linear-gradient(135deg,
    rgb(var(--color-turtle), 0.4) 0%,
    rgb(var(--color-tree-frog), 0.15) 100%);
  border-radius: 18px;
  padding: 20px 24px;
  margin: 24px 0 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border: 2px solid var(--green-dark);
}
.unit-label {
  font-size: var(--text-label-size-medium);
  font-weight: var(--text-label-weight-large);
  color: var(--green);
  text-transform: var(--text-label-casing-medium);
  letter-spacing: var(--text-label-letter-spacing-medium);
  margin-bottom: 4px;
}
.unit-title {
  font-size: var(--text-heading-size-small);
  font-weight: var(--text-heading-weight-small);
  color: var(--text-color);
}
.unit-desc {
  font-size: var(--text-caption-size);
  font-weight: var(--text-caption-weight);
  color: var(--text-secondary);
  margin-top: 2px;
}
.unit-badge {
  background: var(--green);
  border-radius: 50%;
  width: 48px;
  height: 48px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.4rem;
  flex-shrink: 0;
  box-shadow: 0 4px 0 var(--green-shadow);
}
.unit-header-locked {
  background: var(--surface);
  border-radius: 18px;
  padding: 20px 24px;
  margin: 8px 0 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border: 2px solid var(--border);
  opacity: 0.7;
}

/* ── Path ── */
.path-container {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 32px 0;
  position: relative;
}
.path-row {
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  width: 100%;
  height: 120px;
}
.lesson-node {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  cursor: pointer;
}
.lesson-btn {
  width: 72px;
  height: 72px;
  border-radius: 50%;
  border: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.8rem;
  position: relative;
  transition: transform 0.1s;
  outline: none;
}
.lesson-btn:focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }
.lesson-btn:active { transform: scale(0.93); }
.lesson-btn.active {
  background: var(--green);
  box-shadow: 0 6px 0 var(--green-shadow);
  border: 3px solid var(--green-dark);
}
.lesson-btn.completed {
  background: var(--green);
  box-shadow: 0 4px 0 var(--green-shadow);
}
.lesson-btn.locked {
  background: var(--surface-2);
  box-shadow: 0 4px 0 var(--border);
  cursor: not-allowed;
  filter: grayscale(0.5);
}
.lesson-btn.checkpoint {
  width: 80px;
  height: 80px;
  background: var(--gold);
  box-shadow: 0 6px 0 var(--gold-dark);
  border: 3px solid var(--gold-dark);
  font-size: 2rem;
}
.lesson-btn.checkpoint.locked {
  background: var(--surface-2);
  box-shadow: 0 4px 0 var(--border);
  filter: grayscale(0.6);
}
.lesson-label {
  font-size: var(--text-label-size-medium);
  font-weight: var(--text-label-weight-medium);
  text-transform: var(--text-label-casing-medium);
  letter-spacing: var(--text-label-letter-spacing-medium);
  color: var(--text-secondary);
  font-size: 0.7rem;
}
.crown-badge {
  position: absolute;
  top: -6px;
  right: -6px;
  background: var(--gold);
  border-radius: 50%;
  width: 22px;
  height: 22px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.7rem;
  border: 2px solid var(--bg);
}
.active-arrow {
  position: absolute;
  top: -32px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--surface);
  border: 2px solid var(--border);
  border-radius: 10px;
  padding: 4px 10px;
  font-size: 0.7rem;
  font-weight: var(--text-label-weight-medium);
  letter-spacing: var(--text-label-letter-spacing-medium);
  text-transform: var(--text-label-casing-medium);
  color: var(--green);
  white-space: nowrap;
  z-index: 2;
  animation: bounce 1s ease-in-out infinite;
}
.active-arrow::after {
  content: '';
  position: absolute;
  bottom: -6px;
  left: 50%;
  transform: translateX(-50%);
  border: 5px solid transparent;
  border-top-color: var(--border);
}
@keyframes bounce {
  0%, 100% { transform: translateX(-50%) translateY(0); }
  50% { transform: translateX(-50%) translateY(-4px); }
}

/* ── Right Panel ── */
.right-panel {
  padding: 24px 16px;
  display: flex;
  flex-direction: column;
  gap: 20px;
  border-left: 2px solid var(--border);
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
}
.panel-card {
  background: var(--surface);
  border: 2px solid var(--border);
  border-radius: 16px;
  padding: 16px;
}
.panel-title {
  font-size: var(--text-label-size-medium);
  font-weight: var(--text-label-weight-medium);
  text-transform: var(--text-label-casing-medium);
  letter-spacing: 0.1em;
  color: var(--text-secondary);
  margin-bottom: 12px;
}
.stat-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 8px 0;
}
.stat-icon { font-size: 1.6rem; width: 36px; text-align: center; }
.stat-info { display: flex; flex-direction: column; }
.stat-label {
  font-size: var(--text-caption-size);
  font-weight: var(--text-caption-weight);
  color: var(--text-secondary);
}
.stat-value {
  font-size: var(--text-heading-size-xsmall);
  font-weight: var(--text-heading-weight-small);
  color: var(--text-color);
  font-variant-numeric: tabular-nums;
}
.hearts-row { display: flex; gap: 4px; align-items: center; }
.heart { font-size: 1.3rem; }
.heart.empty { filter: grayscale(1) opacity(0.3); }

.leaderboard-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 0;
  border-bottom: 1px solid var(--border);
}
.leaderboard-item:last-child { border-bottom: none; }
.lb-rank {
  font-size: 0.8rem;
  font-weight: var(--text-label-weight-medium);
  color: var(--text-secondary);
  width: 20px;
  text-align: center;
  font-variant-numeric: tabular-nums;
}
.lb-rank.gold-rank   { color: var(--gold);   font-size: 1rem; }
.lb-rank.silver-rank { color: rgb(var(--color-koala)); font-size: 1rem; }
.lb-rank.bronze-rank { color: var(--orange); font-size: 1rem; }
.lb-avatar {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  font-size: 1.2rem;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.lb-name { font-size: var(--text-caption-size); font-weight: var(--text-label-weight-medium); flex: 1; }
.lb-xp   { font-size: var(--text-caption-size); font-weight: var(--text-label-weight-medium); color: var(--blue); font-variant-numeric: tabular-nums; }

.streak-freeze-btn {
  width: 100%;
  padding: 10px;
  background: none;
  border: 2px solid var(--blue);
  border-radius: 12px;
  color: var(--blue);
  font-family: "duolingo-sans", 'Nunito', sans-serif;
  font-weight: var(--text-label-weight-medium);
  font-size: var(--text-caption-size);
  cursor: pointer;
  transition: background 0.12s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}
.streak-freeze-btn:hover { background: rgba(var(--color-macaw), 0.1); }

/* ── Modal ── */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(var(--color-snow), 0.7);
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  backdrop-filter: blur(4px);
}
.modal-overlay[hidden] { display: none !important; }
.modal {
  background: var(--surface);
  border-radius: 24px;
  width: 100%;
  max-width: 560px;
  border: 2px solid var(--border);
  overflow: hidden;
  animation: modalIn 0.2s ease;
}
@keyframes modalIn {
  from { opacity: 0; transform: scale(0.94) translateY(10px); }
  to   { opacity: 1; transform: scale(1)    translateY(0);    }
}
.modal-top-bar {
  padding: 16px 20px;
  display: flex;
  align-items: center;
  gap: 12px;
  border-bottom: 2px solid var(--border);
}
.close-btn {
  background: none;
  border: none;
  color: var(--text-secondary);
  font-size: 1.4rem;
  cursor: pointer;
  padding: 4px;
  line-height: 1;
  border-radius: 8px;
}
.close-btn:hover { background: var(--surface-2); color: var(--text-color); }
.progress-bar-wrap {
  flex: 1;
  height: 14px;
  background: var(--surface-2);
  border-radius: 99px;
  overflow: hidden;
}
.progress-bar-fill {
  height: 100%;
  background: var(--green);
  border-radius: 99px;
  transition: width 0.4s ease;
}
.hearts-display { display: flex; gap: 3px; }
.modal-body { padding: 32px 28px; }
.question-type-label {
  font-size: var(--text-label-size-medium);
  font-weight: var(--text-label-weight-medium);
  text-transform: var(--text-label-casing-medium);
  letter-spacing: var(--text-label-letter-spacing-medium);
  color: var(--text-secondary);
  margin-bottom: 8px;
}
.question-text {
  font-size: var(--text-heading-size-small);
  font-weight: var(--text-heading-weight-small);
  line-height: var(--text-heading-line-height-small);
  margin-bottom: 28px;
  text-wrap: balance;
}
.choices {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 28px;
}
.choice-btn {
  background: var(--surface-2);
  border: 2px solid var(--border);
  border-radius: 14px;
  padding: 14px 16px;
  font-family: "duolingo-sans", 'Nunito', sans-serif;
  font-size: var(--text-caption-size);
  font-weight: var(--text-label-weight-medium);
  color: var(--text-color);
  cursor: pointer;
  text-align: left;
  transition: border-color 0.1s, background 0.1s;
  display: flex;
  align-items: center;
  gap: 10px;
}
.choice-btn:hover:not(:disabled) {
  border-color: var(--blue);
  background: rgba(var(--color-macaw), 0.08);
}
.choice-btn.selected { border-color: var(--blue);  background: rgba(var(--color-macaw),   0.12); }
.choice-btn.correct  { border-color: var(--green); background: rgba(var(--color-owl),     0.12); color: var(--green); }
.choice-btn.wrong    { border-color: var(--red);   background: rgba(var(--color-cardinal), 0.12); color: var(--red); }
.choice-letter {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  background: var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.75rem;
  font-weight: var(--text-label-weight-medium);
  flex-shrink: 0;
}
.choice-btn.selected .choice-letter { background: var(--blue);  color: rgb(var(--color-snow)); }
.choice-btn.correct  .choice-letter { background: var(--green); color: rgb(var(--color-snow)); }
.choice-btn.wrong    .choice-letter { background: var(--red);   color: rgb(var(--color-snow)); }
.modal-footer { padding: 20px 28px; border-top: 2px solid var(--border); }
.modal-footer.correct-state { background: rgba(var(--color-owl),     0.08); border-top-color: var(--green); }
.modal-footer.wrong-state   { background: rgba(var(--color-cardinal), 0.08); border-top-color: var(--red);   }
.feedback-row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.feedback-icon { font-size: 1.4rem; }
.feedback-text {
  font-size: var(--text-caption-size);
  font-weight: var(--text-label-weight-medium);
}
.feedback-text.correct-text { color: var(--green); }
.feedback-text.wrong-text   { color: var(--red); }
.feedback-answer {
  font-size: var(--text-caption-size);
  color: var(--text-secondary);
  font-weight: var(--text-caption-weight);
  margin-top: 2px;
}
.check-btn {
  width: 100%;
  padding: 14px;
  border-radius: 14px;
  border: none;
  font-family: "duolingo-sans", 'Nunito', sans-serif;
  font-size: var(--text-label-size-medium);
  font-weight: var(--text-label-weight-medium);
  letter-spacing: var(--text-label-letter-spacing-medium);
  text-transform: var(--text-label-casing-medium);
  cursor: pointer;
  transition: transform 0.1s, box-shadow 0.1s;
}
.check-btn:active { transform: translateY(2px); }
.check-btn.disabled    { background: var(--surface-2); color: var(--text-secondary); cursor: not-allowed; }
.check-btn.ready       { background: var(--green); color: rgb(var(--color-snow)); box-shadow: 0 4px 0 var(--green-shadow); }
.check-btn.ready:active { box-shadow: 0 2px 0 var(--green-shadow); }
.check-btn.next-state  { background: var(--green); color: rgb(var(--color-snow)); box-shadow: 0 4px 0 var(--green-shadow); }
.check-btn.wrong-btn   { background: var(--red);   color: rgb(var(--color-snow)); box-shadow: 0 4px 0 var(--red-dark); }

/* ── Completion ── */
.completion-screen { padding: 40px 28px; text-align: center; }
.completion-owl { font-size: 5rem; margin-bottom: 16px; animation: popIn 0.4s ease; }
@keyframes popIn {
  0%   { transform: scale(0); }
  70%  { transform: scale(1.2); }
  100% { transform: scale(1); }
}
.completion-title {
  font-size: var(--text-heading-size-large);
  font-weight: var(--text-heading-weight-large);
  line-height: var(--text-heading-line-height-large);
  margin-bottom: 8px;
  color: var(--text-color);
}
.completion-subtitle {
  font-size: var(--text-body-size);
  font-weight: var(--text-body-weight);
  color: var(--text-secondary);
  margin-bottom: 28px;
}
.xp-gained {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: rgba(var(--color-bee), 0.15);
  border: 2px solid var(--gold);
  border-radius: 99px;
  padding: 10px 20px;
  font-size: var(--text-label-size-medium);
  font-weight: var(--text-label-weight-large);
  letter-spacing: var(--text-label-letter-spacing-medium);
  color: var(--gold);
  margin-bottom: 24px;
}
.continue-btn {
  width: 100%;
  padding: 16px;

.restore-btn:disabled { border-color: var(--border); color: var(--text-secondary); cursor: not-allowed; }
.restore-confirm {
  background: rgba(var(--color-cardinal), 0.08);
  border: 2px solid var(--red);
  border-radius: 12px;
  padding: 12px;
  display: flex;
  flex-direction: column;

}
.restore-confirm-text  { font-size: var(--text-caption-size); font-weight: var(--text-label-weight-medium); color: var(--text-color); text-align: center; }

.restore-confirm-btns  { display: flex; gap: 8px; }
.restore-confirm-yes {
  flex: 1; padding: 8px; border-radius: 10px; border: none;

.restore-confirm-no {
  flex: 1; padding: 8px; border-radius: 10px;
  border: 2px solid var(--border); background: none;
  color: var(--text-secondary);

}

.restore-toast {

@keyframes fadeOut { 0%, 60% { opacity: 1; } 100% { opacity: 0; } }

@keyframes xpPop {
  0%   { transform: translateY(0)    scale(1);   opacity: 1; }

<script>
const STATE_KEY = 'duo_state';
let state = { xp: 0, streak: 7, hearts: 5, gems: 500, completedLessons: [], todayXp: 0, lastDate: '' };
try {
  const s = JSON.parse(localStorage.getItem(STATE_KEY));
  if (s) Object.assign(state, s);
  const today = new Date().toDateString();
  if (state.lastDate !== today) { state.todayXp = 0; state.lastDate = today; }
} catch(e) {}

function saveState() {
  try { localStorage.setItem(STATE_KEY, JSON.stringify(state)); } catch(e) {}
}

const lessons = [
  { id: 0, icon: '🎯', label: 'Start', type: 'active', questions: [
    { q: 'What does "Hola" mean?', choices: ['Goodbye','Hello','Thank you','Yes'], answer: 1 },
    { q: 'How do you say "Thank you" in Spanish?', choices: ['Por favor','Lo siento','Gracias','De nada'], answer: 2 },
    { q: 'What is "apple" in Spanish?', choices: ['Naranja','Manzana','Plátano','Uva'], answer: 1 }
  ]},
  { id: 1, icon: '💬', label: 'Greetings', type: 'normal', questions: [
    { q: 'Which phrase means "Good morning"?', choices: ['Buenas noches','Buenas tardes','Buenos días','Hasta luego'], answer: 2 },
    { q: 'What does "¿Cómo estás?" mean?', choices: ['What\'s your name?','How are you?','Where are you from?','How old are you?'], answer: 1 },
    { q: 'How do you say "My name is…"?', choices: ['Yo tengo…','Me llamo…','Soy de…','Tengo… años'], answer: 1 }
  ]},
  { id: 2, icon: '🔢', label: 'Numbers', type: 'normal', questions: [
    { q: 'What number is "tres"?', choices: ['1','2','3','4'], answer: 2 },
    { q: 'How do you say "ten" in Spanish?', choices: ['Ocho','Nueve','Diez','Once'], answer: 2 },
    { q: '"Veinte" means which number?', choices: ['12','20','21','22'], answer: 1 }
  ]},
  { id: 3, icon: '🏆', label: 'Checkpoint', type: 'checkpoint', questions: [
    { q: 'Which sentence means "I am a student"?', choices: ['Yo soy un estudiante','Yo tengo un libro','Yo como una manzana','Yo soy un maestro'], answer: 0 },
    { q: 'What does "La casa es grande" mean?', choices: ['The dog is big','The house is big','The car is fast','The tree is tall'], answer: 1 },
    { q: 'How do you say "I speak Spanish"?', choices: ['Yo escucho español','Yo aprendo español','Yo hablo español','Yo leo español'], answer: 2 },
    { q: 'What is "water" in Spanish?', choices: ['Leche','Jugo','Agua','Café'], answer: 2 }
  ]},
  { id: 4, icon: '🐶', label: 'Animals', type: 'normal', questions: [
    { q: 'What is "dog" in Spanish?', choices: ['Gato','Perro','Pájaro','Pez'], answer: 1 },
    { q: '"El gato bebe leche" means?', choices: ['The cat drinks milk','The dog eats food','The bird sings','The fish swims'], answer: 0 },
    { q: 'How do you say "a big horse"?', choices: ['Un caballo pequeño','Un toro grande','Un caballo grande','Una vaca grande'], answer: 2 }
  ]},
  { id: 5, icon: '🍎', label: 'Food', type: 'normal', questions: [
    { q: 'What is "bread" in Spanish?', choices: ['Leche','Queso','Pan','Arroz'], answer: 2 },
    { q: '"Yo como una pizza" means?', choices: ['I want a pizza','I make a pizza','I eat a pizza','I buy a pizza'], answer: 2 },
    { q: 'How do you say "I am hungry"?', choices: ['Tengo hambre','Tengo sed','Tengo frío','Tengo sueño'], answer: 0 }
  ]},
];

const offsets = [0, 60, 100, 60, 0, -60];
const path = document.getElementById('path');

function buildPath() {
  path.innerHTML = '';
  lessons.forEach((lesson, i) => {
    const isCompleted = state.completedLessons.includes(lesson.id);
    const isActive = !isCompleted && (i === 0 || state.completedLessons.includes(lessons[i-1].id));
    const isLocked = !isCompleted && !isActive;
    const row = document.createElement('div');
    row.className = 'path-row';
    row.style.transform = `translateX(${offsets[i] || 0}px)`;
    let btnClass = 'lesson-btn ' + (isCompleted ? 'completed' : isActive ? 'active' : 'locked');
    if (lesson.type === 'checkpoint') btnClass += ' checkpoint';
    row.innerHTML = `
      <div class="lesson-node" ${isLocked ? '' : `onclick="startLesson(${lesson.id})"`} style="${isLocked ? 'cursor:not-allowed' : ''}">
        ${isActive && i === getNextLesson() ? '<div class="active-arrow">START</div>' : ''}
        <button class="${btnClass}" ${isLocked ? 'disabled' : ''} title="${lesson.label}">
          ${isCompleted ? '⭐' : lesson.icon}
          ${isCompleted ? '<div class="crown-badge">👑</div>' : ''}
        </button>
        <span class="lesson-label">${lesson.label}</span>
      </div>`;
    path.appendChild(row);
  });
}

function getNextLesson() {
  for (let i = 0; i < lessons.length; i++) {
    if (!state.completedLessons.includes(lessons[i].id)) return i;
  }
  return -1;
}

const lbData = [
  { name: 'SarahK',     xp: 1840, flag: '🦊' },
  { name: 'Miguel_ES',  xp: 1720, flag: '🦁' },
  { name: 'You',        xp: 0,    flag: '🦉', isYou: true },
  { name: 'LingoPro',   xp: 980,  flag: '🐨' },
  { name: 'StudyBuddy', xp: 740,  flag: '🐸' },
];

function renderLeaderboard() {
  const sorted = [...lbData].sort((a, b) => b.xp - a.xp);
  const ranks = ['🥇','🥈','🥉'];
  document.getElementById('leaderboard').innerHTML = sorted.map((p, i) => `
    <div class="leaderboard-item" style="${p.isYou ? 'background:rgba(var(--color-macaw),0.05);border-radius:10px;padding:8px;' : ''}">
      <span class="lb-rank ${i < 3 ? ['gold-rank','silver-rank','bronze-rank'][i] : ''}">${i < 3 ? ranks[i] : i+1}</span>
      <div class="lb-avatar">${p.flag}</div>
      <span class="lb-name" style="${p.isYou ? 'color:var(--blue);' : ''}">${p.isYou ? 'You' : p.name}</span>
      <span class="lb-xp">${p.xp} XP</span>
    </div>`).join('');
}

function renderStats() {
  document.getElementById('streak-display').textContent = state.streak;
  document.getElementById('xp-display').textContent = state.xp;
  document.getElementById('gems-display').textContent = state.gems;
  const hr = document.getElementById('hearts-row');
  hr.innerHTML = '';
  for (let i = 0; i < 5; i++) {
    const h = document.createElement('span');
    h.className = 'heart' + (i >= state.hearts ? ' empty' : '');
    h.textContent = '❤️';
    hr.appendChild(h);
  }
  const hs = document.getElementById('hearts-section');
  if (state.hearts < 5) {
    const canAfford = state.gems >= RESTORE_COST;
    hs.innerHTML = `
      <button class="restore-btn" onclick="showRestoreConfirm()" ${canAfford ? '' : 'disabled'}>
        ❤️ Restore Hearts · ${RESTORE_COST} 💎
      </button>
      ${!canAfford ? '<div class="restore-toast error" style="animation:none;opacity:1">Not enough gems (need 350)</div>' : ''}`;
  } else {
    hs.innerHTML = '';
  }
  const goalXp = Math.min(state.todayXp, 20);
  document.getElementById('goal-xp').textContent = goalXp;
  document.getElementById('goal-fill').style.width = (goalXp / 20 * 100) + '%';
  lbData.find(p => p.isYou).xp = state.xp;
  renderLeaderboard();
}

const RESTORE_COST = 350;

function showRestoreConfirm() {
  const missing = 5 - state.hearts;
  document.getElementById('hearts-section').innerHTML = `
    <div class="restore-confirm">
      <div class="restore-confirm-text">Restore all ${missing} heart${missing > 1 ? 's' : ''}?</div>
      <div class="restore-confirm-cost">Costs ${RESTORE_COST} 💎 · You have ${state.gems} 💎</div>
      <div class="restore-confirm-btns">
        <button class="restore-confirm-no" onclick="cancelRestore()">CANCEL</button>
        <button class="restore-confirm-yes" onclick="restoreHearts()">RESTORE</button>
      </div>
    </div>`;
}

function cancelRestore() { renderStats(); }

function restoreHearts() {
  if (state.gems < RESTORE_COST) return;
  state.gems -= RESTORE_COST;
  state.hearts = 5;
  saveState();
  renderStats();
  const toast = document.createElement('div');
  toast.className = 'restore-toast success';
  toast.textContent = '❤️ Hearts fully restored!';
  document.getElementById('hearts-section').appendChild(toast);
  setTimeout(() => toast.remove(), 2000);
  lessonHearts = 5;
  if (!overlay.hidden) renderModalHearts();
}

let currentLesson = null, currentQ = 0, selectedChoice = null, checked = false, lessonHearts = 5;
const overlay   = document.getElementById('modal-overlay');
const closeBtn  = document.getElementById('close-btn');
const progressFill  = document.getElementById('progress-fill');
const modalContent  = document.getElementById('modal-content');

function startLesson(id) {
  currentLesson = lessons.find(l => l.id === id);
  currentQ = 0; selectedChoice = null; checked = false;
  lessonHearts = state.hearts;
  overlay.hidden = false;
  renderQuestion();
}

function renderModalHearts() {
  const mh = document.getElementById('modal-hearts');
  mh.innerHTML = '';
  for (let i = 0; i < 5; i++) {
    const h = document.createElement('span');
    h.style.fontSize = '0.9rem';
    h.textContent = i < lessonHearts ? '❤️' : '🖤';
    mh.appendChild(h);
  }
}

function renderQuestion() {
  const q = currentLesson.questions[currentQ];
  progressFill.style.width = (currentQ / currentLesson.questions.length * 100) + '%';
  renderModalHearts();
  selectedChoice = null; checked = false;
  const letters = ['A','B','C','D'];
  modalContent.innerHTML = `
    <div class="modal-body">
      <div class="question-type-label">Translate this sentence</div>
      <div class="question-text">${q.q}</div>
      <div class="choices" id="choices">
        ${q.choices.map((c, i) => `
          <button class="choice-btn" onclick="selectChoice(${i})" id="choice-${i}">
            <span class="choice-letter">${letters[i]}</span>${c}
          </button>`).join('')}
      </div>
    </div>
    <div class="modal-footer" id="modal-footer">
      <button class="check-btn disabled" id="check-btn" onclick="checkAnswer()">CHECK</button>
    </div>`;
}

function selectChoice(i) {
  if (checked) return;
  selectedChoice = i;
  document.querySelectorAll('.choice-btn').forEach((b, idx) => {
    b.className = 'choice-btn' + (idx === i ? ' selected' : '');
  });
  document.getElementById('check-btn').className = 'check-btn ready';
}

function checkAnswer() {
  if (selectedChoice === null || checked) return;
  checked = true;
  const q = currentLesson.questions[currentQ];
  const correct = selectedChoice === q.answer;
  const footer = document.getElementById('modal-footer');
  document.querySelectorAll('.choice-btn').forEach((b, i) => {
    b.disabled = true;
    if (i === q.answer) b.className = 'choice-btn correct';
    else if (i === selectedChoice && !correct) b.className = 'choice-btn wrong';
  });
  if (correct) {
    footer.className = 'modal-footer correct-state';
    footer.innerHTML = `
      <div class="feedback-row">
        <span class="feedback-icon">✅</span>
        <div><div class="feedback-text correct-text">Correct! Great job!</div></div>
      </div>
      <button class="check-btn next-state" onclick="nextQuestion()">CONTINUE</button>`;
  } else {
    lessonHearts = Math.max(0, lessonHearts - 1);
    state.hearts = Math.max(0, state.hearts - 1);
    renderModalHearts();
    footer.className = 'modal-footer wrong-state';
    footer.innerHTML = `
      <div class="feedback-row">
        <span class="feedback-icon">❌</span>
        <div>
          <div class="feedback-text wrong-text">Incorrect!</div>
          <div class="feedback-answer">Correct answer: ${q.choices[q.answer]}</div>
        </div>
      </div>
      <button class="check-btn wrong-btn" onclick="nextQuestion()">GOT IT</button>`;
    saveState(); renderStats();
  }
}

function nextQuestion() {
  currentQ++;
  if (currentQ >= currentLesson.questions.length) showCompletion();
  else renderQuestion();
}

function showCompletion() {
  const isCheckpoint = currentLesson.type === 'checkpoint';
  const xpGain = 10 + (isCheckpoint ? 10 : 0);
  const gemGain = isCheckpoint ? 20 : (currentLesson.id === 0 ? 10 : 5);
  const perfectBonus = lessonHearts === state.hearts;
  const bonusGems = perfectBonus ? 20 : 0;
  const totalGems = gemGain + bonusGems;

  progressFill.style.width = '100%';
  document.getElementById('modal-topbar').style.display = 'none';
  modalContent.innerHTML = `
    <div class="completion-screen">
      <div class="completion-owl">🦉</div>
      <div class="completion-title">Lesson Complete!</div>
      <div class="completion-subtitle">You finished <strong>${currentLesson.label}</strong></div>
      <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:24px">
        <div class="xp-gained">+${xpGain} ⚡ XP</div>
        <div class="xp-gained" style="border-color:var(--purple);background:rgba(var(--color-beetle),0.12);color:var(--purple)">
          +${totalGems} 💎 Gems
        </div>
        ${perfectBonus ? '<div class="xp-gained" style="border-color:var(--gold);background:rgba(var(--color-bee),0.1);color:var(--gold);font-size:0.85rem">⭐ Perfect +20 💎</div>' : ''}
      </div>
      <button class="continue-btn" onclick="completeLesson()">CONTINUE</button>
    </div>`;
  launchConfetti();
  state.xp += xpGain;
  state.todayXp += xpGain;
  state.gems += totalGems;
  if (!state.completedLessons.includes(currentLesson.id)) state.completedLessons.push(currentLesson.id);
  const today = new Date().toDateString();
  if (state.lastDate !== today) { state.streak++; state.lastDate = today; }
  saveState(); renderStats(); floatXP(xpGain); floatGems(totalGems);
}

function completeLesson() {
  overlay.hidden = true;
  document.getElementById('modal-topbar').style.display = '';
  buildPath();
}

closeBtn.addEventListener('click', () => {
  overlay.hidden = true;
  document.getElementById('modal-topbar').style.display = '';
});
overlay.addEventListener('click', e => {
  if (e.target === overlay) { overlay.hidden = true; document.getElementById('modal-topbar').style.display = ''; }
});

function launchConfetti() {
  const canvas = document.getElementById('confetti');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth; canvas.height = window.innerHeight;
  /* Duolingo's actual token colors: owl, bee, macaw, cardinal, beetle, fox */
  const colors = ['#93d333','#ffc700','#49c0f8','#ee5555','#ce82ff','#ffab33'];
  const particles = Array.from({length: 80}, () => ({
    x: Math.random() * canvas.width, y: Math.random() * canvas.height * 0.3 - 50,
    vx: (Math.random() - 0.5) * 6, vy: Math.random() * 4 + 2,
    size: Math.random() * 8 + 4, color: colors[Math.floor(Math.random() * colors.length)],
    rot: Math.random() * 360, vr: (Math.random() - 0.5) * 8, op: 1
  }));
  let frame = 0;
  const tick = () => {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particles.forEach(p => {
      p.x += p.vx; p.y += p.vy; p.vy += 0.15; p.vx *= 0.99; p.rot += p.vr;
      if (frame > 60) p.op -= 0.018;
      ctx.save(); ctx.globalAlpha = Math.max(0, p.op);
      ctx.translate(p.x, p.y); ctx.rotate(p.rot * Math.PI / 180);
      ctx.fillStyle = p.color; ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size*0.6);
      ctx.restore();
    });
    frame++;
    if (frame < 120) requestAnimationFrame(tick);
    else ctx.clearRect(0, 0, canvas.width, canvas.height);
  };
  requestAnimationFrame(tick);
}

function floatXP(amount) {
  const el = document.createElement('div');
  el.className = 'xp-float';
  el.textContent = '+' + amount + ' XP';
  el.style.left = (window.innerWidth / 2 - 30) + 'px';
  el.style.top  = (window.innerHeight / 2) + 'px';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1000);
}

function floatGems(amount) {
  const el = document.createElement('div');
  el.className = 'xp-float';
  el.style.color = 'var(--purple)';
  el.textContent = '+' + amount + ' 💎';
  el.style.left = (window.innerWidth / 2 + 40) + 'px';
  el.style.top  = (window.innerHeight / 2 + 24) + 'px';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1000);
}

function setNav(btn) {
  document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

buildPath();
renderStats();
</script>
